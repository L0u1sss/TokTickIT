name: CI

on:
  pull_request:
    branches:
      - main
      - lab2-staging
      - lab3-staging
      - lab4-staging
  push:
    branches:
      - main
      - lab2-staging
      - lab3-staging
      - lab4-staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toktickit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d toktickit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/toktickit?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/toktickit_test?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Lint server
        run: npm run lint
        working-directory: server

      - name: Lint client
        run: npm run lint
        working-directory: client

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Validate Prisma schema
        run: npx prisma validate
        working-directory: server

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server

      - name: Prepare isolated test database
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma db seed
        working-directory: server

      - name: Run server test suite
        id: server_tests
        run: npm test -- --reporter=default --reporter=json --outputFile=../artifacts/lab-04/issue-61/hosted-ci/${{ github.run_id }}/server-results.json
        working-directory: server

      - name: Run client test suite
        id: client_tests
        run: npm test -- --reporter=default --reporter=json --outputFile=../artifacts/lab-04/issue-61/hosted-ci/${{ github.run_id }}/client-results.json
        working-directory: client

      - name: Run Lab 4 dashboard performance smoke
        run: npm run test:performance
        working-directory: server

      - name: Run authentication browser suite
        run: npm run test:auth:e2e
        working-directory: client

      - name: Run administrator browser suite
        run: npm run test:admin:e2e
        working-directory: client

      - name: Run staff queue browser suite
        run: node scripts/run-auth-e2e.mjs --staff-queue
        working-directory: client

      - name: Run Actions Taken browser suite
        run: npm run test:actions:e2e
        working-directory: client

      - name: Run Ticket resolution browser suite
        run: npm run test:workflow:e2e
        working-directory: client

      - name: Run role dashboard browser suite
        run: npm run test:dashboards:e2e
        working-directory: client
        env:
          E2E_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run staff workflow browser suite
        run: npm run test:staff:e2e
        working-directory: client

      - name: Run comments and notes browser suite
        run: node scripts/run-auth-e2e.mjs --communications
        working-directory: client

      - name: Run responsive browser suite
        run: npm run test:responsive
        working-directory: client

      - name: Run Lab 4 visual and accessibility hardening suite
        run: npm run test:ui:lab4
        working-directory: client

      - name: Run live end-to-end suite
        run: npm run test:e2e
        working-directory: client

      - name: Build server
        run: npm run build
        working-directory: server

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Record Lab 4 release CI provenance
        if: always()
        run: node scripts/record-lab4-ci.mjs
        env:
          VERIFICATION_STATUS: ${{ job.status }}
          SERVER_TEST_OUTCOME: ${{ steps.server_tests.outcome }}
          CLIENT_TEST_OUTCOME: ${{ steps.client_tests.outcome }}

      - name: Upload Lab 3 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-03-browser-evidence
          path: |
            artifacts/lab-03/screenshots/
            client/test-results/
          if-no-files-found: ignore

      - name: Upload Lab 4 Actions Taken evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-04-actions-taken-evidence
          path: |
            artifacts/lab-04/screenshots/actions-taken/
            artifacts/lab-04/screenshots/ticket-workflow/
            artifacts/lab-04/screenshots/requester-dashboard/
            artifacts/lab-04/screenshots/staff-dashboard/
            artifacts/lab-04/screenshots/workflow-screens/
            artifacts/lab-04/issue-60/
            artifacts/lab-04/issue-61/hosted-ci/
            artifacts/lab-04/issue-59/dashboard-performance.json
            artifacts/lab-04/issue-59/server-results.json
            artifacts/lab-04/issue-59/client-results.json
            client/test-results/live-e2e/
          if-no-files-found: ignore
